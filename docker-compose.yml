version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8081
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - coach-network

  backend:
    build:
      # 使用项目根目录作为构建上下文，这样可以在后端镜像中访问 voice_analysis 模块
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:5000"
    environment:

    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - coach-network
    depends_on:
      - mongodb

  # MongoDB服务 (可选 - 如果使用外部MongoDB可以注释掉)
  mongodb:
    image: mongo:7.0
    container_name: ai-coach-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=ai-coach
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - coach-network

networks:
  coach-network:
    driver: bridge

volumes:
  node_modules:
  mongodb_data:
